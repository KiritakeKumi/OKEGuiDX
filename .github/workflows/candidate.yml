name: Candidate packages
on:
  workflow_dispatch:
    inputs:
      tools_run_id:
        description: Successful OKEGuiDX-tools build run
        required: true
        default: '40921204564'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [win-x64, win-arm64, linux-x64, linux-arm64, linux-riscv64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Resolve successful tools build
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_RUN_ID: ${{ inputs.tools_run_id }}
        run: |
          gh api "repos/KiritakeKumi/OKEGuiDX-tools/actions/runs/$TOOLS_RUN_ID" > "$RUNNER_TEMP/tools-run.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          r = json.load(open(os.environ['RUNNER_TEMP'] + '/tools-run.json'))
          assert r['conclusion'] == 'success' and r['status'] == 'completed'
          assert r['path'] == '.github/workflows/build.yml'
          print('sha=' + r['head_sha'])
          PY
      - uses: actions/checkout@v5
        with:
          repository: KiritakeKumi/OKEGuiDX-tools
          ref: ${{ steps.tools.outputs.sha }}
          path: artifacts/tooling
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: KiritakeKumi/OKEGuiDX-tools
          run-id: ${{ inputs.tools_run_id }}
          pattern: '*-${{ matrix.target }}'
          merge-multiple: true
          path: artifacts/tools-input
      - name: Install chapter compiler
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            win-x64) sudo apt-get update; sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 ;;
            linux-arm64) sudo apt-get update; sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu ;;
            linux-riscv64) sudo apt-get update; sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu ;;
            win-arm64)
              asset=llvm-mingw-20260908-ucrt-ubuntu-22.04-x86_64.tar.xz
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$asset"
              mkdir "$RUNNER_TEMP/llvm-mingw"
              tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
              echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Build candidate
        env:
          TARGET: ${{ matrix.target }}
        run: python3 packaging/build_candidate.py --target "$TARGET" --tools-dir "artifacts/tools-input/$TARGET/tools" --tools-source artifacts/tooling --run-metadata "$RUNNER_TEMP/tools-run.json" --output artifacts/candidate
      - id: name
        env:
          TARGET: ${{ matrix.target }}
        run: echo "artifact=OKEGuiDX-$TARGET-candidate-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            artifacts/candidate/*.zip
            artifacts/candidate/*.tar.gz
            artifacts/candidate/*.sha256
          if-no-files-found: error
  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2025
          - target: win-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-riscv64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@v4
        if: matrix.target == 'linux-riscv64'
        with:
          platforms: riscv64
      - id: name
        env:
          TARGET: ${{ matrix.target }}
        run: echo "artifact=OKEGuiDX-$TARGET-candidate-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: artifacts/verify
      - name: Verify extracted candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'packaging')
          from verify_candidate import verify
          archives = [p for p in Path('artifacts/verify').iterdir() if p.name.endswith(('.zip', '.tar.gz'))]
          assert len(archives) == 1
          verify(archives[0])
          PY
