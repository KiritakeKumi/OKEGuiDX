<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OKEGuiDX 任务列表</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/tasks.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <h1>OKEGuiDX</h1>
        <span id="stream-state" class="pill" data-state="closed">事件流未连接</span>
      </div>
      <p id="node-status" class="muted">正在读取节点状态…</p>
      <nav class="tabs">
        <a href="/" data-route="tasks">任务列表</a>
        <a href="/wizard.html" data-route="wizard">新建任务</a>
        <a href="/static/config.html" data-route="config">设置</a>
      </nav>
    </header>

    <main id="page" class="page"></main>

    <footer class="app-footer muted">
      接口前缀 <code>/api/v1</code>，进度流 <code>/api/v1/events</code>。
      任务列表用 <code>/api/v1/tasks</code> 拉全量，再用事件流打增量。
    </footer>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <div id="modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
